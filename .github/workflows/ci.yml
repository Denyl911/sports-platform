# CI runs the gate: every declared check, the types, and the tests — on
# every pull request and on main. The gate lives in root package.json;
# `scripts/checks.ts gate` is the scan half (layering, errors, rbac, adr,
# docs), `turbo run check typecheck test` the build half.
#
# The test database is a service container: `apps/api/test/setup.ts` pins
# DATABASE_URL to `sports_platform_test`, which POSTGRES_DB creates at
# boot. Schema comes from `db:push` (docs/todo.md names what the empty
# migration ledger means for deploys).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (checks + types + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sports_user
          POSTGRES_PASSWORD: sports_user_password
          POSTGRES_DB: sports_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sports_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sports_user:sports_user_password@localhost:5432/sports_platform_test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply schema to the test database
        run: |
          cd packages/db
          bun --bun run db:push --force

      - name: Gate
        run: bun run gate
